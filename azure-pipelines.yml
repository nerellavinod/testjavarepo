trigger: none  # Disabling automatic triggers for manual runs

parameters:
- name: environmentType
  displayName: 'Environment Type'
  type: string
  default: 'dev'
  values:
  - dev
  - test
  - prod

- name: continueOnResourceDestroy
  displayName: 'Continue even if resources are getting destroyed'
  type: boolean
  default: false

- name: location
  displayName: 'Deployment Location'
  type: string
  default: 'uksouth'

variables:
  azureSubscription: 'TempAugserviceconnection'
  environment: ${{ parameters.environmentType }}
  location: ${{ parameters.location }}
  acrName: 'essdevacrtemp'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'
  AZURE_PRINCIPAL_ID: 'b3df3eba-4b33-4513-b9a4-e5c480c3727b'

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- task: AzureCLI@2
  displayName: 'Safety Check - List Resources'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Current resources that may be affected:"
      az resource list -g rg-$(environment)-test --query "[].{name:name, type:type}" -o table
      
      if [[ "${{ parameters.continueOnResourceDestroy }}" != "true" ]]; then
        echo "Waiting 30 seconds for safety check. Press Ctrl+C to abort if resources should not be destroyed."
        sleep 30
      else
        echo "Continuing without safety wait as destruction of resources is approved."
      fi

- task: AzureCLI@2
  displayName: 'Create and Push Placeholder Images'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az acr login -n $(acrName)
      
      echo "FROM mcr.microsoft.com/dotnet/aspnet:7.0" > Dockerfile
      docker build -t $(acrName).azurecr.io/webfrontend:latest .
      docker build -t $(acrName).azurecr.io/apiservice:latest .
      docker build -t $(acrName).azurecr.io/cache:latest .
      
      docker push $(acrName).azurecr.io/webfrontend:latest
      docker push $(acrName).azurecr.io/apiservice:latest
      docker push $(acrName).azurecr.io/cache:latest

# --- Validation Step with jq parsing to avoid Azure CLI bug ---
- task: AzureCLI@2
  displayName: 'Validate Infrastructure Deployment'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e
      az account set --subscription $(AZURE_SUBSCRIPTION_ID)

      echo "Validating Bicep template..."
      az deployment group validate \
        --resource-group rg-$(environment)-test \
        --template-file infra/main.bicep \
        --parameters \
            environmentName=$(environment) \
            acrName=$(acrName) \
            principalId=$(AZURE_PRINCIPAL_ID) \
            location=$(location) \
        --only-show-errors -o json | jq -r '.properties.provisioningState'

# --- Deploy Step with jq parsing to avoid Azure CLI bug ---
- task: AzureCLI@2
  displayName: 'Deploy Infrastructure (Complete Mode)'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e
      az account set --subscription $(AZURE_SUBSCRIPTION_ID)

      echo "Deploying infrastructure in Complete mode..."
      az deployment group create \
        --name "deployment-$(Build.BuildId)" \
        --resource-group rg-$(environment)-test \
        --template-file infra/main.bicep \
        --parameters \
            environmentName=$(environment) \
            acrName=$(acrName) \
            principalId=$(AZURE_PRINCIPAL_ID) \
            location=$(location) \
        --mode Complete \
        --only-show-errors -o json | jq -r '.properties.provisioningState'

- task: AzureCLI@2
  displayName: 'Verify Final Deployment'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Checking deployment state..."
      az deployment group show \
        --name "deployment-$(Build.BuildId)" \
        --resource-group rg-$(environment)-test \
        -o json | jq -r '.properties.provisioningState'

  env:
    AZURE_PRINCIPAL_ID: $(AZURE_PRINCIPAL_ID)
    AZURE_ENV_NAME: $(environment)
    AZURE_LOCATION: $(location)
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
