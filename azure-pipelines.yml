trigger:
- UiAngulatTest

variables:
  azureSubscription: 'TempAugserviceconnection'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'

  # Managed Identity (UAMI)
  MANAGED_IDENTITY_CLIENT_ID: '26533ce6-9d6c-413b-b4bd-7847aab1f2a2'
  ARM_TENANT_ID: 'add1c500-a6d7-4dbd-b890-7f8cb67d7861'

  # Resource Names
  resourceGroupName: 'TempAugRG'
  location: 'uksouth'
  webAppName: 'hmnao-ui-app'
  TF_STORAGE_ACCOUNT: 'tempaugstorage'
  TF_STORAGE_CONTAINER: 'tfstate'

stages:

# ============================================================
# 1️⃣ TERRAFORM INFRA DEPLOYMENT (ALZ + PE + APP SERVICE)
# ============================================================
- stage: IaC
  displayName: "Provision Infra using Terraform"
  jobs:
  - job: TerraformJob
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: '1.9.8'

    # Terraform Init (ALZ Storage Backend)
    - script: |
        cd Deployment/src
        terraform init \
          -backend-config="resource_group_name=$(resourceGroupName)" \
          -backend-config="storage_account_name=$(TF_STORAGE_ACCOUNT)" \
          -backend-config="container_name=$(TF_STORAGE_CONTAINER)" \
          -backend-config="key=hmnao.tfstate"
      displayName: 'Terraform Init'

    # Terraform Plan
    - script: |
        cd Deployment/src
        terraform plan \
          -var "tenant_id=$(ARM_TENANT_ID)" \
          -var "subscription_id=$(AZURE_SUBSCRIPTION_ID)" \
          -var "client_id=$(MANAGED_IDENTITY_CLIENT_ID)" \
          -var "resource_group_name=$(resourceGroupName)" \
          -var "location=$(location)" \
          -var "app_service_name=$(webAppName)"
      displayName: 'Terraform Plan'

    # Terraform Apply
    - script: |
        cd Deployment/src
        terraform apply -auto-approve \
          -var "tenant_id=$(ARM_TENANT_ID)" \
          -var "subscription_id=$(AZURE_SUBSCRIPTION_ID)" \
          -var "client_id=$(MANAGED_IDENTITY_CLIENT_ID)" \
          -var "resource_group_name=$(resourceGroupName)" \
          -var "location=$(location)" \
          -var "app_service_name=$(webAppName)"
      displayName: 'Terraform Apply'

# ============================================================
# 2️⃣ DEPLOY ANGULAR APP TO WEB APP
# ============================================================
- stage: Deploy
  displayName: "Deploy Angular SSR App"
  dependsOn: IaC
  jobs:
  - template: Deployment/templates/continuous-deployment.yml
    parameters:
      azureSubscription: ${{ variables.azureSubscription }}
      webAppName: ${{ variables.webAppName }}
