trigger:
- UiAngulatTest

variables:
  azureSubscription: 'TempAugserviceconnection1'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'

  resourceGroupName: 'TempAugRG'
  location: 'uksouth'
  webAppName: 'hmnao-ui-app'

  # Backend values (ONLY used in provider.tf, NOT in YAML anymore)
  TF_STORAGE_ACCOUNT: 'tempaugstorage'
  TF_STORAGE_CONTAINER: 'tfstate'


stages:

# ============================================================
# 1️⃣ TERRAFORM INFRA DEPLOYMENT
# ============================================================
- stage: IaC
  displayName: "Provision Infra using Terraform"
  jobs:
  - job: TerraformJob
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    # Install Terraform manually
    - script: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        wget https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
        unzip terraform_1.9.8_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform -version
      displayName: "Install Terraform"


    # Terraform init/plan/apply using service connection OIDC
    - task: AzureCLI@2
      displayName: "Terraform Init/Plan/Apply"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          set -e

          WORKDIR="$(Build.SourcesDirectory)/Deployment/src"

          echo "=== WORKDIR ==="
          echo $WORKDIR

          echo "=== FILES ==="
          ls -l $WORKDIR

          echo "=== CLEAN OLD TERRAFORM CACHE ==="
          rm -rf $WORKDIR/.terraform
          rm -f  $WORKDIR/.terraform.lock.hcl

          echo "=== TERRAFORM INIT (NO BACKEND CONFIG FROM PIPELINE) ==="
          terraform -chdir=$WORKDIR init -reconfigure

          echo "=== TERRAFORM PLAN ==="
          terraform -chdir=$WORKDIR plan \
            -var "resource_group_name=$(resourceGroupName)" \
            -var "location=$(location)" \
            -var "app_service_name=$(webAppName)"

          echo "=== TERRAFORM APPLY ==="
          terraform -chdir=$WORKDIR apply -auto-approve \
            -var "resource_group_name=$(resourceGroupName)" \
            -var "location=$(location)" \
            -var "app_service_name=$(webAppName)"



# ============================================================
# 2️⃣ DEPLOY ANGULAR SSR APP
# ============================================================
- stage: Deploy
  displayName: "Deploy UI App"
  dependsOn: IaC
  jobs:
  - template: Deployment/templates/continuous-deployment.yml
    parameters:
      azureSubscription: ${{ variables.azureSubscription }}
      webAppName: ${{ variables.webAppName }}
