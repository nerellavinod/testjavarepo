trigger:
  - UiAngulatTest

parameters:
- name: environmentType
  displayName: 'Environment Type'
  type: string
  default: 'qa'
  values:
    - qa
    - test
- name: location
  displayName: 'Deployment Location'
  type: string
  default: 'uksouth'
- name: Container
  displayName: 'Container for Build/Test'
  type: string
  default: 'mcr.microsoft.com/azure-pipelines/node8-typescript:latest'

variables:
  - group: uitestdevops-library
  - name: azureSubscription
    value: $(azureSubscription)
  - name: environment
    value: ${{ parameters.environmentType }}
  - name: location
    value: ${{ parameters.location }}
  - name: resourceGroupName
    value: $(resourceGroupName)
  - name: webAppName
    value: $(webAppName)
  - name: NodeVersion
    value: 20.x
  - name: BuildCounter
    value: "$[counter(format('{0:yyyyMMdd}', pipeline.startTime), 1)]"
  - name: DeploymentPool
    value: 'Azure Pipelines'

stages:
- stage: BuildTestPublish
  displayName: Build, Test, and Publish
  jobs:
    - template: Deployment/templates/build-test-publish.yml
      parameters:
        Container: ${{ parameters.Container }}

- stage: TerraformDeploy
  displayName: Terraform Provision Web App
  dependsOn: BuildTestPublish
  jobs:
    - job: Terraform
      displayName: 'Terraform Init/Plan/Apply'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.x'
        - powershell: |
            pwsh Deployment/terraform_conditional_run.ps1 `
              -DeploymentResourceGroupName $(resourceGroupName) `
              -DeploymentStorageAccountName $(tfstateStorageAccountName) `
              -WorkSpace "${{ parameters.environmentType }}" `
              -ContinueEvenIfResourcesAreGettingDestroyed:$false
          name: TerraformStep
          displayName: 'Run Terraform Script'

- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: TerraformDeploy
  jobs:
    - job: DeployWebApp
      displayName: Deploy Angular App to Azure Web App
      variables:
        - name: webapp_url
          value: "$[ dependencies.TerraformDeploy.outputs['Terraform.TerraformStep.webapp_url'] ]"
        - name: webapp_name
          value: "$[ dependencies.TerraformDeploy.outputs['Terraform.TerraformStep.webapp_name'] ]"
      steps:
        - download: current
          artifact: AngularApp
          displayName: 'Download Angular Build Artifact'
        - task: AzureWebApp@1
          inputs:
            azureSubscription: $(azureSubscription)
            appType: 'webAppLinux'
            appName: $(webapp_name)
            package: '$(Pipeline.Workspace)/AngularApp'
            runtimeStack: 'NODE|20-lts'
            startUpCommand: 'npx serve -s .'
          displayName: 'Deploy Angular App to Azure Web App'
        - script: echo "Web App URL: $(webapp_url)"
          displayName: 'Show Web App URL'
