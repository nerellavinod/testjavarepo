trigger:
- UiAngulatTest

parameters:
- name: environmentType
  displayName: 'Environment Type'
  type: string
  default: 'dev'
  values:
    - dev
    - test
    - prod
- name: location
  displayName: 'Deployment Location'
  type: string
  default: 'uksouth'
- name: SnykOnlyFailIfFixable
  displayName: "Snyk should only fail the pipeline if it knows of a fix for an issue"
  type: boolean
  default: false
- name: SnykPassOnIssues
  displayName: "Prevent Snyk from failing the pipeline"
  type: boolean
  default: false

variables:
  azureSubscription: 'TempAugserviceconnection'
  environment: ${{ parameters.environmentType }}
  location: ${{ parameters.location }}
  resourceGroupName: 'tempaugrg'
  webAppName: 'Uiangularwebapp'
  NodeVersion: 20.x
  snykOrgID: '<YOUR_SNYK_ORG_ID_IF_NEEDED>'
  BuildCounter: $[counter(format('{0:yyyyMMdd}', pipeline.startTime), 1)]

stages:
- stage: VulnerabilityChecks
  displayName: Snyk Vulnerability Scan
  jobs:
  - job: snyk_scan
    displayName: 'Snyk Security Scan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
      - task: NodeTool@0
        displayName: Install Node.js
        inputs:
          versionSpec: '$(NodeVersion)'
      - script: npm ci
        displayName: 'npm ci'
      - script: |
          npm install -g snyk
          snyk auth $(SNYK_TOKEN)
          snyk test --all-projects --org=$(snykOrgID) $( if ${{ parameters.SnykOnlyFailIfFixable }}; then echo '--fail-on=upgradable'; fi )
        displayName: 'Snyk: Test for Vulnerabilities'
        env:
          SNYK_TOKEN: $(SNYK_TOKEN)
      - script: |
          snyk monitor --all-projects --org=$(snykOrgID)
        displayName: 'Snyk: Monitor Project'

- stage: BuildTestPublish
  displayName: Build, mutation, coverage, publish
  dependsOn: VulnerabilityChecks
  jobs:
  - job: BuildTest
    displayName: Build/Test/Mutation/Coverage
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: $(NodeVersion)

    - script: npm ci
      displayName: 'npm install (ci)'

    # ---- Angular Version Check ----
    - script: npx ng --version
      displayName: 'Show Angular CLI Version (ng version)'

    - script: |
        node -e "console.log('Angular core version: ' + require('./node_modules/@angular/core/package.json').version)"
      displayName: 'Show @angular/core Version'

    - script: npm run build -- --configuration production
      displayName: 'Build Angular App'

    - script: npm run test:ci -- --code-coverage --watch=false
      displayName: 'Run Unit Tests (with Coverage)'

    - script: npx stryker run
      displayName: 'Run Stryker Mutation Tests'
      continueOnError: true

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      displayName: Publish Unit Test Results
      inputs:
        testRunner: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        testRunTitle: Unit Tests

    - task: PublishCodeCoverageResults@1
      displayName: Publish Code Coverage Results
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/*coverage.xml'
        reportDirectory: 'coverage/'

    - task: PublishBuildArtifacts@1
      displayName: Publish Angular Artifacts
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/dist'
        ArtifactName: AngularApp

- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: BuildTestPublish
  jobs:
  - template: Deployment/templates/continuous-deployment.yml
    parameters:
      azureSubscription: ${{ variables.azureSubscription }}
      webAppName: ${{ variables.webAppName }}
