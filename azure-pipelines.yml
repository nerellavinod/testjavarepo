trigger:
- UiAngulatTest

parameters:
- name: environmentType
  displayName: 'Environment Type'
  type: string
  default: 'qa'
  values:
    - qa
    - test    
- name: location
  displayName: 'Deployment Location'
  type: string
  default: 'uksouth'
- name: SnykOnlyFailIfFixable
  displayName: "Snyk should only fail the pipeline if it knows of a fix for an issue"
  type: boolean
  default: false
- name: SnykPassOnIssues
  displayName: "Prevent Snyk from failing the pipeline"
  type: boolean
  default: false

variables:
  azureSubscription: 'TempAugserviceconnection'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'
  environment: ${{ parameters.environmentType }}
  location: ${{ parameters.location }}
  resourceGroupName: 'tempaugrg'
  webAppName: 'Uiangularwebapp'
  NodeVersion: 20.x
  TF_KEY_VAULT: '<your-landingzone-keyvault>'
  TF_STORAGE_ACCOUNT: '<your-landingzone-storageaccount>'
  TF_STORAGE_CONTAINER: '<your-tfstate-container>'
  BuildCounter: $[counter(format('{0:yyyyMMdd}', pipeline.startTime), 1)]

stages:
- stage: VulnerabilityChecks
  displayName: Snyk Vulnerability Scan
  jobs:
  - job: snyk_scan
    displayName: 'Snyk Security Scan'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
      - task: NodeTool@0
        displayName: Install Node.js
        inputs:
          versionSpec: '$(NodeVersion)'
      - script: npm ci
        displayName: 'npm ci'
      # - script: |
      #     npm install -g snyk
      #     snyk auth $(SNYK_TOKEN)
      #     snyk test --all-projects --org=$(snykOrgID) $( if ${{ parameters.SnykOnlyFailIfFixable }}; then echo '--fail-on=upgradable'; fi )
      #   displayName: 'Snyk: Test for Vulnerabilities'
      #   env:
      #     SNYK_TOKEN: $(SNYK_TOKEN)
      # - script: |
      #     snyk monitor --all-projects --org=$(snykOrgID)
      #   displayName: 'Snyk: Monitor Project'

- stage: BuildTestPublish
  displayName: Build, mutation, coverage, publish
  dependsOn: VulnerabilityChecks
  jobs:
  - job: BuildTest
    displayName: Build/Test/Mutation/Coverage
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Install Node.js
      inputs:
        versionSpec: $(NodeVersion)

    - script: npm ci
      displayName: 'npm install (ci)'

    # ---- Angular Version Check ----
    - script: npx ng --version
      displayName: 'Show Angular CLI Version (ng version)'

    - script: |
        node -e "console.log('Angular core version: ' + require('./node_modules/@angular/core/package.json').version)"
      displayName: 'Show @angular/core Version'

    - script: npm run build -- --configuration production
      displayName: 'Build Angular App'

    - script: npm run test:ci -- --code-coverage --watch=false
      displayName: 'Run Unit Tests (with Coverage)'

    - script: npx stryker run
      displayName: 'Run Stryker Mutation Tests'
      continueOnError: true

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      displayName: Publish Unit Test Results
      inputs:
        testRunner: 'JUnit'
        testResultsFiles: '**/TEST-*.xml'
        testRunTitle: Unit Tests

    - task: PublishCodeCoverageResults@1
      displayName: Publish Code Coverage Results
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/*coverage.xml'
        reportDirectory: 'coverage/'

    # --- SSR ZIP & ARTIFACT PUBLISH ---
    - task: CopyFiles@2
      inputs:
        SourceFolder: '.'
        Contents: 'package.json'
        TargetFolder: 'dist/uitestdevops'
      displayName: 'Copy package.json to dist'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: 'dist/uitestdevops'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/angularapp.zip'
        replaceExistingArchive: true
      displayName: 'Create deployment package (SSR zip)'

    - task: PublishBuildArtifacts@1
      displayName: Publish Angular SSR Artifact
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/angularapp.zip'
        artifactName: AngularApp

- stage: IaC
  displayName: Provision/Update Landing Zone Infra with Terraform
  dependsOn: BuildTestPublish
  jobs:
  - job: Terraform
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
      - task: Terraform@1
        displayName: 'Install and Use Terraform CLI'
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: 'Deployment/src'
          backendServiceArm: $(azureSubscription)
          backendAzureRmResourceGroupName: $(resourceGroupName)
          backendAzureRmStorageAccountName: $(TF_STORAGE_ACCOUNT)
          backendAzureRmContainerName: $(TF_STORAGE_CONTAINER)
          backendAzureRmKey: 'terraform.tfstate'
      - task: Terraform@1
        displayName: 'Terraform Plan'
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: 'Deployment/src'
          environmentServiceNameAzureRM: $(azureSubscription)
          vars: |
            key_vault_name=$(TF_KEY_VAULT)
            app_service_name=$(webAppName)
      - task: Terraform@1
        displayName: 'Terraform Apply'
        inputs:
          provider: 'azurerm'
          command: 'apply'
          workingDirectory: 'Deployment/src'
          environmentServiceNameAzureRM: $(azureSubscription)
          vars: |
            key_vault_name=$(TF_KEY_VAULT)
            app_service_name=$(webAppName)
          ensureBackend: true
          allowTelemetryCollection: false
          autoApprove: true
        env:
          ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        # Managed Identity from service connection

- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: IaC
  jobs:
  - template: Deployment/templates/continuous-deployment.yml
    parameters:
      azureSubscription: ${{ variables.azureSubscription }}
      webAppName: ${{ variables.webAppName }}
