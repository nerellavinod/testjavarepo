trigger:  
- UiAngulatTest

variables:
  # Use the new Azure DevOps service connection (OIDC-based SPN)
  azureSubscription: 'TempAugserviceconnection1'

  # Subscription / RG / Storage
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'
  resourceGroupName: 'TempAugRG'
  location: 'uksouth'

  # App Service
  webAppName: 'hmnao-ui-app'

  # Terraform backend config
  TF_STORAGE_ACCOUNT: 'tempaugstorage'
  TF_STORAGE_CONTAINER: 'tfstate'


stages:

# ============================================================
# 1️⃣ TERRAFORM INFRA DEPLOYMENT
# ============================================================
- stage: IaC
  displayName: "Provision Infra using Terraform"
  jobs:
  - job: TerraformJob
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    # Install Terraform manually
    - script: |
        sudo apt-get update
        sudo apt-get install -y wget unzip
        wget https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
        unzip terraform_1.9.8_linux_amd64.zip
        sudo mv terraform /usr/local/bin/
        terraform -version
      displayName: "Install Terraform"

    # Use AzureCLI@2 for login + Terraform Init/Plan/Apply
    - task: AzureCLI@2
      displayName: "Terraform Init/Plan/Apply"
      inputs:
        azureSubscription: $(azureSubscription)
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true   # exposes ARM_CLIENT_ID / ARM_TENANT_ID / ARM_SUBSCRIPTION_ID / ARM_CLIENT_SECRET
        inlineScript: |
          echo "=== Terraform init ==="
          terraform -chdir=$(System.DefaultWorkingDirectory)/Deployment/src init \
            -backend-config="resource_group_name=$(resourceGroupName)" \
            -backend-config="storage_account_name=$(TF_STORAGE_ACCOUNT)" \
            -backend-config="container_name=$(TF_STORAGE_CONTAINER)" \
            -backend-config="key=hmnao.tfstate"

          echo "=== Terraform plan ==="
          terraform -chdir=$(System.DefaultWorkingDirectory)/Deployment/src plan \
            -var "resource_group_name=$(resourceGroupName)" \
            -var "location=$(location)" \
            -var "app_service_name=$(webAppName)"

          echo "=== Terraform apply ==="
          terraform -chdir=$(System.DefaultWorkingDirectory)/Deployment/src apply -auto-approve \
            -var "resource_group_name=$(resourceGroupName)" \
            -var "location=$(location)" \
            -var "app_service_name=$(webAppName)"


# ============================================================
# 2️⃣ DEPLOY ANGULAR SSR APP
# ============================================================
- stage: Deploy
  displayName: "Deploy Angular SSR App"
  dependsOn: IaC
  jobs:
  - template: Deployment/templates/continuous-deployment.yml
    parameters:
      azureSubscription: ${{ variables.azureSubscription }}
      webAppName: ${{ variables.webAppName }}
