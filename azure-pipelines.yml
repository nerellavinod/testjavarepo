trigger:
  - main

parameters:
  - name: environmentType
    displayName: 'Environment Type'
    type: string
    default: 'dev'
    values:
      - dev
      - test
      - prod
  - name: location
    displayName: 'Deployment Location'
    type: string
    default: 'uksouth'

variables:
  azureSubscription: 'TempAugserviceconnection'
  environment: ${{ parameters.environmentType }}
  location: ${{ parameters.location }}
  resourceGroupName: 'tempaugrg'
  webAppName: 'uiangularwebapp-b2e2amgqafdde5eh'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'

stages:
- stage: Build
  displayName: 'Build Angular SSR App'
  jobs:
    - job: BuildAngular
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self
          clean: true
        
        - task: NodeTool@0
          inputs:
            versionSpec: '20.x'
          displayName: 'Install Node.js 20 LTS'
        
        - script: |
            npm install
            npm run build -- --configuration production
          displayName: 'Build Angular SSR App'

        # Copy package.json to dist folder so it's included in the zip
        - task: CopyFiles@2
          inputs:
            SourceFolder: '.'
            Contents: 'package.json'
            TargetFolder: 'dist/uitestdevops'
          displayName: 'Copy package.json to dist'

        # Archive the entire dist/uitestdevops folder directly
        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: 'dist/uitestdevops'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/angularapp.zip'
            replaceExistingArchive: true
          displayName: 'Create deployment package'
        
        # Only publish the zip file
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)/angularapp.zip'
            artifactName: 'drop'
          displayName: 'Publish Build Artifacts'

- stage: Deploy
  displayName: 'Deploy to Azure Web App'
  dependsOn: Build
  jobs:
    - job: DeployWebApp
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - download: current
          artifact: drop
          displayName: 'Download Build Artifacts'
        
        - task: AzureWebApp@1
          inputs:
            azureSubscription: '$(azureSubscription)'
            appType: 'webAppLinux'
            appName: '$(webAppName)'
            package: '$(Pipeline.Workspace)/drop/angularapp.zip'
            runtimeStack: 'NODE|20-lts'
            # Startup command to run the SSR server
            startUpCommand: 'npm install --omit=dev && node server/server.mjs'
          displayName: 'Deploy Angular SSR App to Azure Web App'
