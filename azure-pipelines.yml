# File: azure-pipelines.yml (root pipeline)
trigger:
  - UiAngularTest   # corrected branch name

parameters:
- name: environmentType
  displayName: 'Environment Type'
  type: string
  default: 'qa'
  values:
    - qa
    - test
- name: location
  displayName: 'Deployment Location'
  type: string
  default: 'uksouth'
- name: Container
  displayName: 'Container for Build/Test'
  type: string
  default: 'mcr.microsoft.com/devcontainers/javascript-node:20'  # chosen container image

variables:
  - group: uitestdevops-library
  - name: azureSubscription
    value: TempAugserviceconnection
  - name: environment
    value: ${{ parameters.environmentType }}
  - name: location
    value: ${{ parameters.location }}
  - name: NodeVersion
    value: 20.x
  - name: BuildCounter
    value: "$[counter(format('{0:yyyyMMdd}', pipeline.startTime), 1)]"
  - name: DeploymentPool
    value: 'Azure Pipelines'

stages:
- stage: BuildTestPublish
  displayName: Build, Test, and Publish
  jobs:
    - template: Deployment/templates/build-test-publish.yml
      parameters:
        Container: ${{ parameters.Container }}

- stage: TerraformDeploy
  displayName: Terraform Provision Web App
  dependsOn: BuildTestPublish
  jobs:
    - job: Terraform
      displayName: 'Terraform Init/Plan/Apply'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        # install python if needed by terraform script (keeps your previous UsePython step)
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.x'

        # Install Terraform (kept as you had)
        - script: |
            wget https://releases.hashicorp.com/terraform/1.3.7/terraform_1.3.7_linux_amd64.zip
            unzip terraform_1.3.7_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform -version
          displayName: 'Install Terraform'

        # Run the PowerShell terraform script under AzureCLI@2 so az CLI is authenticated
        - task: AzureCLI@2
          name: TerraformStep
          displayName: 'Run Terraform Script (authenticated via service connection)'
          inputs:
            azureSubscription: '$(azureSubscription)'
            scriptType: 'ps'
            scriptLocation: 'inlineScrip
