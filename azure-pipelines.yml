- stage: IaC
  displayName: Provision/Update Landing Zone Infra with Terraform
  dependsOn: BuildTestPublish
  jobs:
  - job: Terraform
    pool:
      vmImage: 'ubuntu-latest'
    steps:
      - checkout: self
      - script: |
          az login
        displayName: 'Azure CLI Login (interactive, for self-hosted agent)'
      - script: |
          cd Deployment/src
          terraform --version
          terraform init -backend-config="resource_group_name=$(resourceGroupName)" \
                         -backend-config="storage_account_name=$(TF_STORAGE_ACCOUNT)" \
                         -backend-config="container_name=$(TF_STORAGE_CONTAINER)" \
                         -backend-config="key=terraform.tfstate"
        displayName: 'Terraform Init'
      - script: |
          cd Deployment/src
          terraform plan -var "key_vault_name=$(TF_KEY_VAULT)" \
                         -var "app_service_name=$(webAppName)"
        displayName: 'Terraform Plan'
      - script: |
          cd Deployment/src
          terraform apply -auto-approve \
            -var "key_vault_name=$(TF_KEY_VAULT)" \
            -var "app_service_name=$(webAppName)"
        displayName: 'Terraform Apply'

- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: IaC
  jobs:
  - template: Deployment/templates/continuous-deployment.yml
    parameters:
      azureSubscription: ${{ variables.azureSubscription }}
      webAppName: ${{ variables.webAppName }}
