trigger:
- UiAngulatTest

parameters:
- name: environmentType
  displayName: 'Environment Type'
  type: string
  default: 'qa'
  values:
    - qa
    - test    
- name: location
  displayName: 'Deployment Location'
  type: string
  default: 'uksouth'
- name: SnykOnlyFailIfFixable
  displayName: "Snyk should only fail the pipeline if it knows of a fix for an issue"
  type: boolean
  default: false
- name: SnykPassOnIssues
  displayName: "Prevent Snyk from failing the pipeline"
  type: boolean
  default: false

variables:
  azureSubscription: 'TempAugserviceconnection'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'
  environment: ${{ parameters.environmentType }}
  location: ${{ parameters.location }}
  resourceGroupName: 'tempaugrg'
  webAppName: 'Uiangularwebapp'
  NodeVersion: 20.x
  TF_KEY_VAULT: '<your-landingzone-keyvault>'
  TF_STORAGE_ACCOUNT: '<your-landingzone-storageaccount>'
  TF_STORAGE_CONTAINER: '<your-tfstate-container>'
  BuildCounter: $[counter(format('{0:yyyyMMdd}', pipeline.startTime), 1)]

