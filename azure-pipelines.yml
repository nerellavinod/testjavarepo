# File: azure-pipelines.yml
trigger:
  - UiAngularTest   # corrected branch name

parameters:
- name: environmentType
  displayName: 'Environment Type'
  type: string
  default: 'qa'
  values:
    - qa
    - test
- name: location
  displayName: 'Deployment Location'
  type: string
  default: 'uksouth'
- name: Container
  displayName: 'Container for Build/Test'
  type: string
  default: 'mcr.microsoft.com/devcontainers/javascript-node:20'  # Node container

variables:
  - group: uitestdevops-library
  - name: azureSubscription
    value: TempAugserviceconnection
  - name: environment
    value: ${{ parameters.environmentType }}
  - name: location
    value: ${{ parameters.location }}
  - name: NodeVersion
    value: 20.x
  - name: BuildCounter
    value: "$[counter(format('{0:yyyyMMdd}', pipeline.startTime), 1)]"
  - name: DeploymentPool
    value: 'Azure Pipelines'

stages:

# -------------------------------
# Stage 1: Build, Test, and Publish Angular App
# -------------------------------
- stage: BuildTestPublish
  displayName: Build, Test, and Publish
  jobs:
    - template: Deployment/templates/build-test-publish.yml
      parameters:
        Container: ${{ parameters.Container }}

# -------------------------------
# Stage 2: Terraform Deployment
# -------------------------------
- stage: TerraformDeploy
  displayName: Terraform Provision Web App
  dependsOn: BuildTestPublish
  jobs:
    - job: Terraform
      displayName: 'Terraform Init/Plan/Apply'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self

        # Install Python (required by terraform script if any Python modules used)
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.x'

        # Install Terraform
        - script: |
            wget https://releases.hashicorp.com/terraform/1.3.7/terraform_1.3.7_linux_amd64.zip
            unzip terraform_1.3.7_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform -version
          displayName: 'Install Terraform'

        # Run Terraform script inside AzureCLI for authentication
        - task: AzureCLI@2
          name: TerraformStep
          displayName: 'Run Terraform Script (Azure CLI authenticated)'
          inputs:
            azureSubscription: '$(azureSubscription)'
            scriptType: 'ps'
            scriptLocation: 'inlineScript'
            inlineScript: |
              Write-Host "Running terraform_conditional_run.ps1 under AzureCLI context"
              pwsh "$(Pipeline.Workspace)/Deployment/src/terraform_conditional_run.ps1" `
                -DeploymentResourceGroupName "$(resourceGroupName)" `
                -DeploymentStorageAccountName "$(tfstateStorageAccountName)" `
                -WorkSpace "$(environment)" `
                -ContinueEvenIfResourcesAreGettingDestroyed:$false

# -------------------------------
# Stage 3: Deploy Angular App
# -------------------------------
- stage: Deploy
  displayName: Deploy Angular App to Azure Web App
  dependsOn: TerraformDeploy
  jobs:
    - template: Deployment/templates/continuous-deployment.yml
      parameters:
        azureSubscription: $(azureSubscription)
        webAppName: $(webAppName)
        resourceGroupName: $(resourceGroupName)
        Container: ${{ parameters.Container }}
        ContinueEvenIfResourcesAreGettingDestroyed: false
        AzureDevOpsEnvironment: $(environment)
        ShortName: 'uitestdevops'
