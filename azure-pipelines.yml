trigger:
  - main

parameters:
  - name: environmentType
    displayName: 'Environment Type'
    type: string
    default: 'dev'
    values:
      - dev
      - test
      - prod
  - name: location
    displayName: 'Deployment Location'
    type: string
    default: 'uksouth'

variables:
  azureSubscription: 'TempAugserviceconnection'
  environment: ${{ parameters.environmentType }}
  location: ${{ parameters.location }}
  resourceGroupName: 'tempaugrg'
  webAppName: 'Uiangularwebapp'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'

stages:
- stage: Build
  displayName: 'Build Angular App'
  jobs:
    - job: BuildAngular
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - checkout: self
          clean: true
        
        - task: NodeTool@0
          inputs:
            versionSpec: '20.x'
          displayName: 'Install Node.js 20 LTS'
        
        - script: |
            npm install
            npm run build -- --configuration production
          displayName: 'Build Angular App'

        # Ensure the build output is placed into the artifact staging directory
        - task: CopyFiles@2
          inputs:
            SourceFolder: 'dist/uitestdevops'
            Contents: '**'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/angular_dist'
          displayName: 'Copy build output to: $(Build.ArtifactStagingDirectory)/angular_dist'

        # Archive the build output into a single zip so AzureWebApp deploys the package correctly
        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/angular_dist'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/angularapp.zip'
            replaceExistingArchive: true
          displayName: 'Create zip of build output'
        
        - task: PublishBuildArtifacts@1
          inputs:
            pathToPublish: '$(Build.ArtifactStagingDirectory)'
            artifactName: 'drop'
          displayName: 'Publish Build Artifacts'

- stage: Deploy
  displayName: 'Deploy to Azure Web App'
  dependsOn: Build
  jobs:
    - job: DeployWebApp
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - download: current
          artifact: drop
          displayName: 'Download Build Artifacts'
        
        - task: AzureWebApp@1
          inputs:
            azureSubscription: '$(azureSubscription)'
            appType: 'webAppLinux'
            appName: '$(webAppName)'
            # Point to the zip created in the Build stage
            package: '$(Pipeline.Workspace)/drop/angularapp.zip'
            runtimeStack: 'NODE|20-lts'
            # Ensure App Service runs the package directly
            appSettings: |
              -WEBSITE_RUN_FROM_PACKAGE 1
          displayName: 'Deploy Angular App to Azure Web App'
