# File: azure-pipelines.yml
trigger:
  - UiAngularTest

parameters:
- name: environmentType
  displayName: "Environment Type"
  type: string
  default: "qa"
  values:
    - qa
    - test

- name: location
  displayName: "Deployment Location"
  type: string
  default: "uksouth"

- name: SnykOnlyFailIfFixable
  displayName: "Snyk should only fail the pipeline if it knows of a fix for an issue"
  type: boolean
  default: false

- name: SnykPassOnIssues
  displayName: "Prevent Snyk from failing the pipeline"
  type: boolean
  default: false

- name: RunStryker
  displayName: "Run Stryker Mutation Tests"
  type: boolean
  default: false

- name: Container
  displayName: "Container for Build/Test"
  type: string
  default: "mcr.microsoft.com/devcontainers/javascript-node:20"

variables:
  - group: uitestdevops-library

  - name: azureSubscription
    value: TempAugserviceconnection

  - name: environment
    value: ${{ parameters.environmentType }}

  - name: location
    value: ${{ parameters.location }}

  - name: NodeVersion
    value: 20.x

  - name: BuildCounter
    value: "$[counter(format('{0:yyyyMMdd}', pipeline.startTime), 1)]"

  - name: DeploymentPool
    value: "Azure Pipelines"

  - name: snykAbzuOrganizationId
    value: aeb7543b-8394-457c-8334-a31493d8910d

# ===================================================================
# Stage 1 — Vulnerability Checks
# ===================================================================
stages:

- stage: VulnerabilityChecks
  displayName: Snyk checks
  dependsOn: []
  jobs:
  - template: Deployment/templates/vulnerability-checks.yml
    parameters:
      SnykOnlyFailIfFixable: ${{ parameters.SnykOnlyFailIfFixable }}
      SnykPassOnIssues: ${{ parameters.SnykPassOnIssues }}

# ===================================================================
# Stage 2 — Mutation Testing with Stryker
# ===================================================================
- stage: RUNSTRYKER
  displayName: "Run Stryker Mutation Tests"
  dependsOn: []
  jobs:
    - job: Stryker
      displayName: Run Stryker Mutation Tests
      condition: eq('${{ parameters.RunStryker }}', true)
      pool:
        vmImage: "ubuntu-latest"
      workspace:
        clean: all
      steps:
        - checkout: self
          submodules: true
        
        - task: NodeTool@0
          displayName: Install Node.js
          inputs:
            versionSpec: $(NodeVersion)
        
        - script: npm ci
          displayName: Install dependencies
        
        - script: |
            npx stryker run
          displayName: Run Stryker Mutation Tests
          continueOnError: true
        
        - task: PublishBuildArtifacts@1
          displayName: Publish Stryker Mutation Report
          condition: succeededOrFailed()
          inputs:
            PathtoPublish: '$(Build.SourcesDirectory)/reports/mutation'
            ArtifactName: StrykerMutationReport

# ===================================================================
# Stage 3 — Build/Unit Test/Publish Angular App
# ===================================================================
- stage: BuildTestPublish
  displayName: "Build, Test, and Publish Angular App"
  jobs:
    - template: Deployment/templates/build-test-publish.yml
      parameters:
        Container: ${{ parameters.Container }}
        environmentType: ${{ parameters.environmentType }}

