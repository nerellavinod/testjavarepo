trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'bicep-serviceconnetion-tempp'   
  environment: 'dev'
  location: 'uksouth'
  acrName: 'essdevacrtemp'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'
  AZURE_PRINCIPAL_ID: '6bbb29a1-ec8e-4b3a-849e-9ebb77bde171'

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- task: AzureCLI@2
  displayName: 'Safety Check - List Resources'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Current resources that may be affected:"
      az resource list -g rg-$(environment)-test --query "[].{name:name, type:type}" -o table
      echo "Waiting 10 seconds for safety check..."
      sleep 10

- task: AzureCLI@2
  displayName: 'Deploy Infrastructure (Complete Mode)'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "Setting Azure subscription..."
      az account set --subscription $(AZURE_SUBSCRIPTION_ID)

      echo "Creating resource group if not exists..."
      az group create --name rg-$(environment)-test --location $(location)

      echo "Deploying infrastructure in Complete mode..."
      az deployment group create \
        --name "deployment-$(Build.BuildId)" \
        --resource-group rg-$(environment)-test \
        --template-file infra/main.bicep \
        --parameters \
            environmentName=$(environment) \
            acrName=$(acrName) \
            principalId=$(AZURE_PRINCIPAL_ID) \
            location=$(location) \
        --mode Complete

- task: AzureCLI@2
  displayName: 'Build and Push Container Images'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Login to ACR
      az acr login -n $(acrName)
      
      # Build and push Web frontend
      docker build -t $(acrName).azurecr.io/webfrontend:latest -f src/Web/Dockerfile .
      docker push $(acrName).azurecr.io/webfrontend:latest
      
      # Build and push API service
      docker build -t $(acrName).azurecr.io/apiservice:latest -f src/ApiService/Dockerfile .
      docker push $(acrName).azurecr.io/apiservice:latest

- task: AzureCLI@2
  displayName: 'Deploy Container Apps'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Deploying container apps..."
      az containerapp update \
        --name webfrontend \
        --resource-group rg-$(environment)-test \
        --image $(acrName).azurecr.io/webfrontend:latest

      az containerapp update \
        --name apiservice \
        --resource-group rg-$(environment)-test \
        --image $(acrName).azurecr.io/apiservice:latest

- task: AzureCLI@2
  displayName: 'Verify Final Deployment'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Final resources after deployment:"
      az resource list -g rg-$(environment)-test --query "[].{name:name, type:type}" -o table

  env:
    AZURE_PRINCIPAL_ID: $(AZURE_PRINCIPAL_ID)
    AZURE_ENV_NAME: $(environment)
    AZURE_LOCATION: $(location)
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)