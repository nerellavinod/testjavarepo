trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'bicep-serviceconnetion-temp'   # Your Azure DevOps service connection name
  environment: 'dev'
  location: 'uksouth'
  acrName: 'essdevacrtemp'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'  # Replace with your actual subscription ID
  AZURE_PRINCIPAL_ID: '350a0541-d3a0-4e6b-9af5-49254f7cd488'  # Replace with your actual principal ID

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- script: |
    curl -fsSL https://aka.ms/install-azd.sh | bash
    echo "azd installed successfully"
  displayName: 'Install Azure Developer CLI (azd)'

- task: AzureCLI@2
  displayName: 'Deploy with azd up (Bicep)'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e

      echo "Setting Azure subscription explicitly..."
      az account set --subscription $(AZURE_SUBSCRIPTION_ID)

      echo "Configuring azd to use Azure CLI authentication..."
      azd config set auth.useAzCliAuth "true"

      echo "Setting default deployment location to: $(location)"
      azd config set default-location $(location)

      echo "Setting infra path explicitly to ./infra"
      azd config set infra.path ./infra

      echo "Cleaning up old azd environment (if any)..."
      azd env delete --yes --environment $(environment) || true
      rm -rf .azure/$(environment)

      echo " check version"
      azd version

      echo "Running azd init with force..."
      azd init --no-prompt --environment $(environment)

      echo "Setting azd environment parameters..."
      azd env set acrName "$(acrName)" --environment $(environment)
      azd env set environmentName "$(environment)" --environment $(environment)
      azd env set location "$(location)" --environment $(environment)
      azd env set principalId "$(AZURE_PRINCIPAL_ID)" --environment $(environment)

      echo "Dumping azd environment values:"
      azd env get-values --environment $(environment)

      echo "Provisioning Azure infrastructure..."
      azd provision --no-prompt 

      echo "Deploying Aspire application..."
      azd deploy --no-prompt --environment $(environment)      
    workingDirectory: '$(Build.SourcesDirectory)'
  env:
    AZURE_PRINCIPAL_ID: $(AZURE_PRINCIPAL_ID)
    AZURE_ENV_NAME: $(environment)
    AZURE_LOCATION: $(location)
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)  