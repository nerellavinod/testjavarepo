trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'bicep-serviceconnetion-temp'   # Your Azure DevOps service connection name
  environment: 'dev'
  location: 'uksouth'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'  # Replace with your actual subscription ID

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- script: |
    set -e

    echo "Setting Azure subscription..."
    az account set --subscription $(AZURE_SUBSCRIPTION_ID)

    echo "Installing Azure Developer CLI..."
    curl -fsSL https://aka.ms/install-azd.sh | bash

    echo "Configuring azd to use Azure CLI authentication..."
    azd config set auth.useAzCliAuth "true"

    echo "Setting default deployment location to: $(location)"
    azd config set default-location $(location)

    echo "Setting infra path to ./infra"
    azd config set infra.path ./infra

    echo "Running azd init..."
    azd init --no-prompt --environment $(environment)

    echo "Copying parameter file to .azure/$(environment)/main.parameters.json"
    mkdir -p .azure/$(environment)
    cp infra/parameters.json .azure/$(environment)/main.parameters.json

    echo "Verifying parameter file:"
    cat .azure/$(environment)/main.parameters.json

    echo "Provisioning Azure resources..."
    azd provision --no-prompt --environment $(environment)

    echo "Deploying Aspire app..."
    azd deploy --no-prompt --environment $(environment)

  displayName: 'Run azd CLI end-to-end'
  env:
    AZURE_PRINCIPAL_ID: '350a0541-d3a0-4e6b-9af5-49254f7cd488'
    AZURE_ENV_NAME: $(environment)
    AZURE_LOCATION: $(location)
    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
