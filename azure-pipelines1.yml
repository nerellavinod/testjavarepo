trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'bicep-serviceconnetion-temp'   # Your Azure DevOps service connection name
  environment: 'dev'
  location: 'uksouth'
  acrName: 'essdevacrtemp'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'  # Replace with your actual subscription ID
  AZURE_PRINCIPAL_ID: '350a0541-d3a0-4e6b-9af5-49254f7cd488'  # Replace with your actual principal ID

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- script: |
    curl -sLo terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
    unzip terraform.zip
    sudo mv terraform /usr/local/bin/
    terraform -version
  displayName: 'Install Terraform'

- task: AzureCLI@2
  displayName: 'Terraform Init/Plan/Apply'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      cd infra
      terraform init
      terraform plan -out=tfplan
      terraform apply -auto-approve tfplan