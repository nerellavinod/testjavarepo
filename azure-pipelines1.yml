trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'testew22'   # Your Azure DevOps service connection name
  environment: 'dev'
  location: 'uksouth'
  acrName: 'essdevacrtemp'
  AZURE_SUBSCRIPTION_ID: 'c3d246d3-988a-45ae-ba70-f7faac1e2d0a'  # Replace with your actual subscription ID
  AZURE_PRINCIPAL_ID: '350a0541-d3a0-4e6b-9af5-49254f7cd488'  # Replace with your actual principal ID

steps:
- checkout: self
  clean: true

- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.x'

- script: |
    curl -sLo terraform.zip https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
    unzip terraform.zip
    sudo mv terraform /usr/local/bin/
    terraform -version
  displayName: 'Install Terraform'

- task: AzureCLI@2
  displayName: 'Terraform Init/Plan/Apply'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      cd infra
      terraform init
      terraform plan -out=tfplan
      terraform apply -auto-approve tfplan

- task: Docker@2
  displayName: Build and Push Web Image
  inputs:
    command: buildAndPush
    repository: essdevacrtemp.azurecr.io/webfrontend
    dockerfile: src/Web/Dockerfile
    tags: latest
    containerRegistry: bicep-to-terrafrom-dockerSC

- task: Docker@2
  displayName: Build and Push API Image
  inputs:
    command: buildAndPush
    repository: essdevacrtemp.azurecr.io/apiservice
    dockerfile: src/ApiService/Dockerfile
    tags: latest
    containerRegistry: bicep-to-terrafrom-dockerSC

- task: AzureCLI@2
  displayName: Deploy Webfrontend to Container App
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az containerapp update \
        --name <webfrontend-app-name> \
        --resource-group rg-dev \
        --image essdevacrtemp.azurecr.io/webfrontend:latest

- task: AzureCLI@2
  displayName: Deploy API Service to Container App
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az containerapp update \
        --name <apiservice-app-name> \
        --resource-group rg-dev \
        --image essdevacrtemp.azurecr.io/apiservice:latest